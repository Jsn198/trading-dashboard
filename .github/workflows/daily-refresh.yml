name: Daily Streamlit Refresh
on:
  schedule:
    # 3:45 AM UTC = 9:15 AM IST (market open)
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  warm-up:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging at $(date)"
          curl -L --max-time 300 https://trading-dashboard-jashan.streamlit.app -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
          echo "App warmed up"
