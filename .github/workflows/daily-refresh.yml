name: Daily Streamlit Refresh
on:
  schedule:
    # Runs at 3:30 AM UTC = 9:00 AM IST (Monday-Friday)
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s https://trading-dashboard-jashan.streamlit.app > /dev/null
          echo "App pinged at $(date)"
